<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Payment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 40px 20px;
        }

        .payment-box {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        img {
            width: 250px;
            max-width: 100%;
        }

        .pay-button {
            display: block;
            background: #008000;
            color: white;
            padding: 15px;
            margin-top: 20px;
            border-radius: 10px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="payment-box">

    <h1>Food Order Payment</h1>

    <p>Total Payment</p>

    <h2>RM 15.00</h2>

    <p>Scan QR di bawah untuk membuat pembayaran.</p>

    <!-- MASUKKAN QR KAU DI SINI -->
    <img src="qr.jpeg" alt="Payment QR">

    <p>
        Selepas pembayaran, kembali ke Jotform
        dan upload bukti pembayaran.
    </p>

    <a class="pay-button"
       href="https://YOUR-JOTFORM-LINK"
       target="_blank">
       KEMBALI KE ORDER
    </a>

</div>

</body>
</html>
